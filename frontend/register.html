<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SmartSpend</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z'/></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, rgba(248, 250, 252, 1) 90%);
        }
        [data-theme="dark"] body {
            background: radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.12) 0%, rgba(11, 15, 25, 1) 90%);
        }
        .auth-card {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.12);
            padding: 2.25rem;
        }
    </style>
</head>
<body>

    <!-- Floating Theme Switcher -->
    <div class="position-fixed top-0 end-0 p-3">
        <button type="button" class="btn-icon theme-toggle-btn" title="Toggle Light/Dark Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h2 class="fw-bold mb-1 text-dark">Get Started</h2>
            <p class="text-muted small">Create your free SmartSpend personal account</p>
        </div>

        <!-- Registration Form -->
        <form id="registerForm" novalidate>
            <!-- Full Name -->
            <div class="mb-3">
                <label for="regName" class="form-label-custom">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" class="form-control form-control-custom border-start-0" id="regName" placeholder="e.g. Alex Morgan" required minlength="2" maxlength="100">
                </div>
                <div class="invalid-feedback">Please enter your name (at least 2 characters).</div>
            </div>

            <!-- Email Address -->
            <div class="mb-3">
                <label for="regEmail" class="form-label-custom">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" class="form-control form-control-custom border-start-0" id="regEmail" placeholder="name@example.com" required maxlength="150">
                </div>
                <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="regPassword" class="form-label-custom">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" class="form-control form-control-custom border-start-0" id="regPassword" placeholder="Minimum 6 characters" required minlength="6">
                </div>
                <div class="invalid-feedback">Password must be at least 6 characters long.</div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
                <label for="regConfirmPassword" class="form-label-custom">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted">
                        <i class="fa-solid fa-shield-halved"></i>
                    </span>
                    <input type="password" class="form-control form-control-custom border-start-0" id="regConfirmPassword" placeholder="Re-enter password" required>
                </div>
                <div class="invalid-feedback" id="confirmFeedback">Passwords do not match.</div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-custom w-100 py-2 justify-content-center mb-3" id="btnSubmitRegister">
                <i class="fa-solid fa-user-plus me-2"></i>
                <span id="regBtnText">Create Account</span>
            </button>

            <!-- Login Footer Link -->
            <div class="text-center pt-3 border-top">
                <span class="text-muted small">Already have an account?</span>
                <a href="login.html" class="fw-bold ms-1 small">Sign In</a>
            </div>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const regForm = document.getElementById('registerForm');
            const nameInput = document.getElementById('regName');
            const emailInput = document.getElementById('regEmail');
            const passInput = document.getElementById('regPassword');
            const confirmInput = document.getElementById('regConfirmPassword');
            const submitBtn = document.getElementById('btnSubmitRegister');
            const btnText = document.getElementById('regBtnText');

            regForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (passInput.value !== confirmInput.value) {
                    confirmInput.setCustomValidity("Passwords do not match");
                } else {
                    confirmInput.setCustomValidity("");
                }

                if (!regForm.checkValidity()) {
                    regForm.classList.add('was-validated');
                    return;
                }

                submitBtn.disabled = true;
                btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Creating account...';

                try {
                    await SmartSpend.register(nameInput.value.trim(), emailInput.value.trim().toLowerCase(), passInput.value);
                    SmartSpend.showToast('Account created successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 400);
                } catch (err) {
                    submitBtn.disabled = false;
                    btnText.innerHTML = '<i class="fa-solid fa-user-plus me-2"></i> Create Account';
                    SmartSpend.showToast(err.message || 'Registration failed.', 'danger');
                }
            });
        });
    </script>
</body>
</html>
