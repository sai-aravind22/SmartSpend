<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — SmartSpend</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z'/></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, rgba(248, 250, 252, 1) 90%);
        }
        [data-theme="dark"] body {
            background: radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.12) 0%, rgba(11, 15, 25, 1) 90%);
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.12);
            padding: 2.25rem;
        }
    </style>
</head>
<body>

    <!-- Floating Theme Switcher -->
    <div class="position-fixed top-0 end-0 p-3">
        <button type="button" class="btn-icon theme-toggle-btn" title="Toggle Light/Dark Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h2 class="fw-bold mb-1 text-dark">Welcome Back</h2>
            <p class="text-muted small">Sign in to your SmartSpend personal financial dashboard</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="loginEmail" class="form-label-custom">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" class="form-control form-control-custom border-start-0" id="loginEmail" placeholder="name@example.com" required>
                </div>
                <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="loginPassword" class="form-label-custom mb-0">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" class="form-control form-control-custom border-start-0 border-end-0" id="loginPassword" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary border-start-0 text-muted" type="button" id="togglePasswordBtn" tabindex="-1">
                        <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
                <div class="invalid-feedback">Please enter your password.</div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-custom w-100 py-2 justify-content-center mb-3" id="btnSubmitLogin">
                <i class="fa-solid fa-right-to-bracket me-2"></i>
                <span id="loginBtnText">Sign In</span>
            </button>

            <!-- 1-Click Demo Login Button -->
            <button type="button" class="btn btn-outline-custom w-100 py-2 justify-content-center mb-4" id="btnDemoLogin">
                <i class="fa-solid fa-wand-magic-sparkles text-warning me-2"></i>
                <span>1-Click Demo Login</span>
            </button>

            <!-- Register Footer Link -->
            <div class="text-center pt-3 border-top">
                <span class="text-muted small">Don't have an account?</span>
                <a href="register.html" class="fw-bold ms-1 small">Create Free Account</a>
            </div>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const submitBtn = document.getElementById('btnSubmitLogin');
            const btnText = document.getElementById('loginBtnText');
            const togglePassBtn = document.getElementById('togglePasswordBtn');
            const togglePassIcon = document.getElementById('togglePasswordIcon');
            const demoBtn = document.getElementById('btnDemoLogin');

            // Toggle password visibility
            togglePassBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    togglePassIcon.className = 'fa-solid fa-eye-slash';
                } else {
                    passwordInput.type = 'password';
                    togglePassIcon.className = 'fa-solid fa-eye';
                }
            });

            // 1-Click Demo Login
            demoBtn.addEventListener('click', (e) => {
                e.preventDefault();
                emailInput.value = 'demo@smartspend.com';
                passwordInput.value = 'password123';
                if (typeof loginForm.requestSubmit === 'function') {
                    loginForm.requestSubmit();
                } else {
                    submitBtn.click();
                }
            });

            // Form Submit
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!loginForm.checkValidity()) {
                    loginForm.classList.add('was-validated');
                    return;
                }

                const email = emailInput.value.trim().toLowerCase();
                const password = passwordInput.value;

                submitBtn.disabled = true;
                btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Signing in...';

                try {
                    await SmartSpend.login(email, password);
                    SmartSpend.showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 400);
                } catch (err) {
                    submitBtn.disabled = false;
                    btnText.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> Sign In';
                    SmartSpend.showToast(err.message || 'Invalid email or password', 'danger');
                }
            });
        });
    </script>
</body>
</html>
